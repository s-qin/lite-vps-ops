name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: bash -n lite-vps-ops bootstrap.sh lib/*.sh tests/*.sh scripts/*.sh
      - name: ShellCheck
        run: shellcheck -S warning lite-vps-ops bootstrap.sh lib/*.sh tests/*.sh scripts/*.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/unit.sh
      - run: bash tests/resource-envelope.sh
      - run: bash tests/migration-timer.sh
      - run: bash tests/receipt.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/integration.sh
      - run: bash tests/fault-injection.sh
      - run: bash tests/dry-run.sh
      - run: bash tests/retention-lock.sh
      - run: bash tests/bootstrap-cleanup.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package.sh
      - name: Verify archive and checksums
        run: |
          cd dist
          sha256sum -c lite-vps-ops-v1.1.0.tar.gz.sha256
          sha256sum -c checksums.txt
          tar -tzf lite-vps-ops-v1.1.0.tar.gz | grep -Fxq lite-vps-ops

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  debian-13-container-boundary:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install boundary-test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends bash coreutils findutils procps systemd
      - name: Confirm non-booted container boundary
        run: |
          bash -n lite-vps-ops bootstrap.sh lib/*.sh
          if ./lite-vps-ops audit 2>&1 | grep -Fq 'A booted systemd is required'; then
            echo 'BOUNDARY PASS: this container is intentionally not reported as systemd E2E'
          else
            echo 'Unexpected platform-boundary result'; exit 1
          fi
